name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: step [9] resolves review subject commits against git log
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/validate.py
      # spec drift is a CI failure: the CLI ships as the scoped npm package
      # @fission-ai/openspec (the bare "openspec" package is unrelated);
      # pinned version, bumps are deliberate PRs
      - run: npm i -g @fission-ai/openspec@1.14.0
      - run: openspec validate --specs
